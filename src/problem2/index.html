      -->

        style="
          max-width: 420px;
          margin: 15vh auto 0;
          padding: 24px;
          border-radius: 24px;
          background: #fff;
          color: #121826;
          font: 16px/1.55 system-ui, -apple-system, sans-serif;
          box-shadow: 0 18px 40px -20px rgb(18 24 38 / 0.25);
        "
      >
        <p style="margin: 0 0 8px; font-size: 20px; font-weight: 700">
          This demo needs a browser
        </p>
        <p style="margin: 0 0 8px">
          You’re seeing a preview that doesn’t run JavaScript, so the swap app can’t start.
        </p>
        <p style="margin: 0; color: #5b6577">
          Open this file in Chrome, Safari, Edge or Firefox on a computer. On a phone, use the
          hosted link instead.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
